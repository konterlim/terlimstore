<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terlim Store - Em Breve</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; width: 100%; text-align: center; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; color: #38bdf8; }
        p { color: #94a3b8; margin-bottom: 30px; }
        .countdown { display: flex; justify-content: center; gap: 15px; margin-bottom: 40px; }
        .time-box { background: #1e293b; padding: 15px; border-radius: 8px; min-width: 80px; border: 1px solid #334155; }
        .time-box span { display: block; font-size: 2rem; font-weight: bold; color: #f8fafc; }
        .time-box label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
        form { background: #1e293b; padding: 25px; border-radius: 8px; border: 1px solid #334155; text-align: left; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #cbd5e1; }
        input, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; }
        button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        .contact-info { margin-top: 25px; font-size: 0.9rem; color: #94a3b8; }
        footer { margin-top: 40px; font-size: 0.8rem; color: #64748b; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Terlim Store</h1>
        <p>Estamos preparando uma nova experiência para você. Lançamento em breve!</p>

        <div class="countdown">
            <div class="time-box"><span id="days">00</span><label>Dias</label></div>
            <div class="time-box"><span id="hours">00</span><label>Horas</label></div>
            <div class="time-box"><span id="minutes">00</span><label>Minutos</label></div>
            <div class="time-box"><span id="seconds">00</span><label>Segundos</label></div>
        </div>

        <form id="contactForm">
            <div class="form-group">
                <label for="name">Nome *</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail *</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="phone">WhatsApp</label>
                <input type="tel" id="phone">
            </div>
            <div class="form-group">
                <label for="message">Mensagem *</label>
                <textarea id="message" rows="4" required></textarea>
            </div>
            <button type="submit">Enviar via WhatsApp</button>
        </form>

        <div class="contact-info">
            E-mail de contato: <span id="emailText"></span>
        </div>

        <footer>
            &copy; <span id="year"></span> Terlim Store. Todos os direitos reservados.
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
